name: Desktop Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-tests.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Tests
        working-directory: desktop
        run: npm test
